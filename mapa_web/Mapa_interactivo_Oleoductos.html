<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa interactivo de oleoductos del Ecuador</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif} #map{height:100%;width:100%}
.panel{position:absolute;z-index:1000;top:12px;left:58px;background:#fff;padding:12px 15px;border-radius:8px;box-shadow:0 1px 8px #5558;max-width:310px}
.panel h2{font-size:16px;margin:0 0 7px} .panel p{font-size:12px;margin:4px 0;color:#444}
.legend{background:white;padding:9px 12px;line-height:22px;border-radius:6px;box-shadow:0 1px 6px #5558}
.swatch{display:inline-block;width:25px;height:5px;margin-right:7px;vertical-align:middle}
.pin{width:14px;height:14px;border:2px solid white;border-radius:50%;box-shadow:0 0 2px #333}
@media(max-width:600px){.panel{max-width:220px}}
</style></head><body><div id="map"></div>
<div class="panel"><h2>Oleoductos SOTE y OCP – Ecuador</h2><p>Selecciona una estación o terminal para consultar sus datos.</p><p>Usa + / − para acercar y alejar. Los círculos numerados agrupan puntos cercanos.</p></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map=L.map('map').setView([-0.05,-78.5],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const lineData={"type": "FeatureCollection", "features": [{"id": "0", "type": "Feature", "properties": {"nombre": "Oleoducto SOTE", "sistema": "SOTE", "color": "Rojo", "descripcion": "Trazado esquemático digitalizado a partir del mapa proporcionado; verificar con cartografía oficial."}, "geometry": {"type": "LineString", "coordinates": [[-79.68259224219489, 0.8641114982578397], [-79.55771050141911, 0.7247386759581882], [-79.38741721854305, 0.5505226480836237], [-79.17928098391674, 0.33275261324041816], [-78.99006622516556, 0.13675958188153325], [-78.91438032166509, 0.0060975609756097615], [-78.74408703878902, -0.10278745644599296], [-78.60028382213812, -0.18989547038327537], [-78.44134342478714, -0.2987804878048781], [-78.32024597918638, -0.3858885017421603], [-78.10454115421003, -0.47299651567944245], [-77.94938505203406, -0.3641114982578397], [-77.779091769158, -0.23344947735191623], [-77.60879848628193, -0.12456445993031351], [-77.41958372753075, -0.015679442508710784], [-77.2379375591296, 0.06271777003484313]]}}, {"id": "1", "type": "Feature", "properties": {"nombre": "Oleoducto OCP", "sistema": "OCP", "color": "Azul", "descripcion": "Trazado esquemático digitalizado a partir del mapa proporcionado; verificar con cartografía oficial."}, "geometry": {"type": "LineString", "coordinates": [[-79.64853358561967, 0.9163763066202091], [-79.53878902554399, 0.7682926829268293], [-79.38741721854305, 0.5940766550522647], [-79.19820245979186, 0.3545296167247387], [-79.0279091769158, 0.11498257839721249], [-78.91438032166509, -0.08101045296167264], [-78.7251655629139, -0.1681184668989546], [-78.60028382213812, -0.18989547038327537], [-78.4035004730369, -0.27700348432055755], [-78.21428571428571, -0.3423344947735192], [-78.04399243140965, -0.4076655052264808], [-77.87369914853359, -0.27700348432055755], [-77.76017029328288, -0.14634146341463428], [-77.63528855250709, -0.020034843205575026], [-77.45742667928099, 0.027874564459930085], [-77.2379375591296, 0.06271777003484313]]}}]};
const pointData={"type": "FeatureCollection", "features": [{"id": "0", "type": "Feature", "properties": {"nombre": "Esmeraldas", "tipo": "Terminal marítimo", "sistema": "OCP", "descripcion": "Terminal marítimo representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-79.64853358561967, 0.9163763066202091]}}, {"id": "1", "type": "Feature", "properties": {"nombre": "Balao", "tipo": "Terminal marítimo", "sistema": "SOTE", "descripcion": "Terminal marítimo representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-79.68259224219489, 0.8641114982578397]}}, {"id": "2", "type": "Feature", "properties": {"nombre": "Chiquilpe", "tipo": "Estación de bombeo", "sistema": "SOTE / OCP", "descripcion": "Estación de bombeo representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-78.91438032166509, -0.08101045296167264]}}, {"id": "3", "type": "Feature", "properties": {"nombre": "Quito", "tipo": "Capital del Ecuador", "sistema": "Referencia", "descripcion": "Capital del Ecuador representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-78.60028382213812, -0.18989547038327537]}}, {"id": "4", "type": "Feature", "properties": {"nombre": "Papallacta", "tipo": "Estación de bombeo", "sistema": "SOTE / OCP", "descripcion": "Estación de bombeo representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-78.32024597918638, -0.3858885017421603]}}, {"id": "5", "type": "Feature", "properties": {"nombre": "Baeza", "tipo": "Estación de bombeo", "sistema": "SOTE", "descripcion": "Estación de bombeo representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-78.10454115421003, -0.47299651567944245]}}, {"id": "6", "type": "Feature", "properties": {"nombre": "Sardinas", "tipo": "Estación de bombeo", "sistema": "OCP", "descripcion": "Estación de bombeo representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-78.04399243140965, -0.4076655052264808]}}, {"id": "7", "type": "Feature", "properties": {"nombre": "Cayagama", "tipo": "Estación de bombeo", "sistema": "OCP", "descripcion": "Estación de bombeo representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-77.63528855250709, -0.020034843205575026]}}, {"id": "8", "type": "Feature", "properties": {"nombre": "Lago Agrio / Nueva Loja", "tipo": "Inicio de oleoducto", "sistema": "SOTE / OCP", "descripcion": "Inicio de oleoducto representado en el mapa fuente."}, "geometry": {"type": "Point", "coordinates": [-77.2379375591296, 0.06271777003484313]}}]};
const sote=L.geoJSON(lineData,{filter:f=>f.properties.sistema==='SOTE',style:{color:'#df2424',weight:5,opacity:.9},onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.nombre+'</b><br>'+f.properties.descripcion)});
const ocp=L.geoJSON(lineData,{filter:f=>f.properties.sistema==='OCP',style:{color:'#1682c4',weight:4,opacity:.95},onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.nombre+'</b><br>'+f.properties.descripcion)});
const cluster=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true});
L.geoJSON(pointData,{pointToLayer:(f,latlng)=>L.circleMarker(latlng,{radius:7,fillColor:f.properties.tipo.includes('Terminal')?'#f2c94c':(f.properties.tipo.includes('Capital')?'#7a69c7':'#35a86b'),color:'#fff',weight:2,fillOpacity:1}),
onEachFeature:(f,l)=>l.bindPopup('<b>'+f.properties.nombre+'</b><br><b>Tipo:</b> '+f.properties.tipo+'<br><b>Sistema:</b> '+f.properties.sistema+'<br>'+f.properties.descripcion)}).eachLayer(l=>cluster.addLayer(l));
cluster.addTo(map); sote.addTo(map); ocp.addTo(map);
L.control.layers({},{'Oleoducto SOTE':sote,'Oleoducto OCP':ocp,'Estaciones y terminales (agrupadas)':cluster},{collapsed:false}).addTo(map);
const legend=L.control({position:'bottomright'});legend.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<b>SIMBOLOGÍA</b><br><span class="swatch" style="background:#df2424"></span>Oleoducto SOTE<br><span class="swatch" style="background:#1682c4"></span>Oleoducto OCP<br>🟢 Estaciones / 🔶 Terminales';return d};legend.addTo(map);
const bounds=L.geoJSON(lineData).getBounds();map.fitBounds(bounds.pad(.12));
</script></body></html>
